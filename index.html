<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sladké mámení</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <button type="button" class="homeLink" data-i18n="home" onclick="location.reload()"></button>

    <div class="langSwitch">
        <button type="button" class="langBtn" data-lang="cs" onclick="setLang('cs')">CS</button>
        <button type="button" class="langBtn" data-lang="sk" onclick="setLang('sk')">SK</button>
        <button type="button" class="langBtn" data-lang="fr" onclick="setLang('fr')">FR</button>
    </div>

    <div id="saveStatus" class="saveStatus" aria-live="polite"></div>
</div>

<div class="container">

    <div id="loginScreen" class="card">
        <h1 data-i18n="app_title"></h1>
        <p class="intro" data-i18n="app_intro"></p>

        <label for="nameInput" data-i18n="name_label"></label>

        <input
            type="text"
            id="nameInput"
            list="respondentList"
            data-i18n-placeholder="name_placeholder"
            autocomplete="off">

        <datalist id="respondentList"></datalist>

        <button class="submit" id="startButton" data-i18n="start_button" onclick="startSurvey()"></button>

        <p id="loginMessage" class="message"></p>

        <div class="divider"></div>

        <button type="button" class="secondary" id="overviewButton" data-i18n="overview_button" onclick="showOverview()"></button>

        <button type="button" class="secondary" id="highlightsButton" data-i18n="highlights_button" onclick="showHighlights()"></button>
    </div>

    <div id="gridScreen" style="display:none;">
        <h1 class="gridTitle" data-i18n="grid_title"></h1>
        <p class="gridMeta" id="gridMeta"></p>

        <div class="card searchCard" id="searchCard">
            <div id="starterIntro" style="display:none;">
                <div class="starterTitle" data-i18n="starter_title"></div>
                <p class="starterText" data-i18n="starter_text"></p>
            </div>

            <label for="searchInput" data-i18n="search_label"></label>
            <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" autocomplete="off" oninput="onSearchInput()">

            <div id="addArea" style="display:none;">
                <p class="addHint" id="addHint"></p>
                <button type="button" class="submit" id="addButton" onclick="addCandy()"></button>
            </div>

            <p id="addMessage" class="message"></p>
        </div>

        <div class="filterRow">
            <div class="pills">
                <button type="button" class="pill" id="filterAll" data-i18n="filter_all" onclick="setFilter('all')"></button>
                <button type="button" class="pill" id="filterUnvoted" data-i18n="filter_unvoted" onclick="setFilter('unvoted')"></button>
            </div>
            <div class="legend" aria-hidden="true">😖🙁😐🙂😍</div>
        </div>

        <p class="gridHint" data-i18n="grid_hint"></p>

        <p class="gridEmpty" id="gridEmpty" style="display:none;"></p>

        <div class="candyList" id="candyList"></div>
    </div>

    <div id="overviewScreen" class="card" style="display:none;">
        <h2 data-i18n="overview_title"></h2>

        <label for="personSelect" data-i18n="person_select_label"></label>
        <select id="personSelect" onchange="onPersonSelected()">
            <option value="" data-i18n="person_select_default"></option>
        </select>

        <div class="divider"></div>

        <p class="hint" data-i18n="overview_hint"></p>

        <div id="overviewList"></div>
    </div>

    <div id="reviewScreen" class="card" style="display:none;">
        <button type="button" class="linkBack" data-i18n="review_back_link" onclick="showOverview()"></button>

        <h2 id="reviewTitle"></h2>

        <div id="reviewList" class="candyList"></div>
    </div>

    <div id="highlightsScreen" class="card" style="display:none;">
        <h2 data-i18n="highlights_title"></h2>

        <h3 data-i18n="top_favorite_heading"></h3>
        <div id="topFavoriteList"></div>

        <h3 data-i18n="top_unpopular_heading"></h3>
        <div id="topUnpopularList"></div>

        <h3 data-i18n="top_controversial_heading"></h3>
        <p class="hint" data-i18n="controversial_hint"></p>
        <div id="topControversialList"></div>
    </div>

</div>

<footer class="footer">
    <a href="https://unicornsandlazers.github.io/gift-survey/" data-i18n="footer_gifts_link"></a>
</footer>

<script src="app.js"></script>
</body>
</html>
